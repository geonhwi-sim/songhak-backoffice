# 로컬 개발용 Postgres. 실행: docker compose up -d db
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-songhak}
      POSTGRES_USER: ${POSTGRES_USER:-songhak}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?.env에 POSTGRES_PASSWORD를 설정하세요}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-songhak} -d ${POSTGRES_DB:-songhak}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
